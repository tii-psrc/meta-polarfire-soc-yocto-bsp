# Linux kernel configuration fragment file.

# This configuration fragment is part of the scai-navc machine definition and is 
# applied during the Linux kernel build process. 
# It ensures that the kernel has the necessary drivers and file system support 
# for the QSPI flash memory used in the SpacecraftAI NAVC hardware platform.

# The configuration works together with the u-boot settings  
# (like CONFIG_ENV_IS_IN_UBI=y) to provide a complete flash memory management 
# solution for the embedded system.


CONFIG_MTD_SPI_NOR_USE_4K_SECTORS=n
# Enables UBI (Unsorted Block Images) support in the Linux kernel
# UBI is a volume management system for raw flash memory devices
# It provides wear leveling, bad block management, and volume management for NAND/NOR flash
# This is essential for managing flash storage reliably

CONFIG_MTD_UBI=y
# Disables 4KB sector support for SPI NOR flash
# Uses the default sector size (usually 64KB) instead of 4KB sectors
# This affects how the flash memory is organized and accessed

CONFIG_MTD_CMDLINE_PARTS=y
# Enables MTD (Memory Technology Device) partition parsing from kernel command line
# Allows defining flash memory partitions via kernel boot parameters
#Useful for flexible partition layout configuration

CONFIG_UBIFS_FS=y
# Enables UBIFS (UBI File System) support
# UBIFS is a file system designed specifically for UBI-managed flash memory
# Provides better performance and reliability for flash storage compared to traditional file systems

CONFIG_SPI_SCAI_FPGA_CORE=y
# Enables the SPI driver for SCAI FPGA SPI controller
