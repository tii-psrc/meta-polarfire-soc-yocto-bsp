# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"


BBFILE_COLLECTIONS += "meta-polarfire-soc-bsp-scai"
BBFILE_PATTERN_meta-polarfire-soc-bsp-scai = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-polarfire-soc-bsp-scai = "7"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_meta-polarfire-soc-bsp-scai = "1"

LAYERDEPENDS_meta-polarfire-soc-bsp-scai = "meta-polarfire-soc-bsp"

LAYERSERIES_COMPAT_meta-polarfire-soc-bsp-scai = "scarthgap"
